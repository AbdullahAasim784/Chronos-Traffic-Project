[theme]
base = "dark"
primaryColor = "#3B82F6"
backgroundColor = "#0b1220"
secondaryBackgroundColor = "#132036"
textColor = "#F9FAFB"
font = "sans serif"

[client]
toolbarMode = "minimal"
showSidebarNavigation = false

[server]
# Serves the static/ folder at /app/static/ (used for the Plus Jakarta Sans font files)
enableStaticServing = true
